<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>VaultOS Terminals</title>
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="preload" href="/fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Same theme as the main window, before first paint.
    try { const t = localStorage.getItem('vaultboard.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body class="term-popout">
  <!-- The VaultOS Terminals window: the same terminal workspace as the dock
       (spaces, splits, draggable dividers), full-window. Its
       sessions aren't remembered here: closing or reloading the window hands
       them all back to the dock in the main VaultOS window. -->
  <div id="term-area"></div>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/vendor/addon-web-links.js"></script>
  <script src="/vendor/addon-webgl.js"></script>
  <script src="/vendor/addon-unicode11.js"></script>
  <script src="term.js"></script>
  <script src="termtree.js"></script>
  <script src="termside.js"></script>
  <script src="termpick.js"></script>
  <script src="termkeys.js"></script>
  <script src="termtoast.js"></script>
  <script src="termui.js"></script>
  <script>
    'use strict';
    const chan = (() => { try { return new BroadcastChannel('vaultos-workbench'); } catch (e) { return null; } })();

    let count = 0, alert = '';
    // The chosen agent's name, for "<name> needs you" (neutral words until /api/me answers, or with no agent).
    let agentName = null;
    fetch('/api/me').then((r) => r.json()).then((me) => { agentName = me.agent ? me.agent.label : null; }).catch(() => {});
    const retitle = () => { document.title = alert + (count ? `VaultOS Terminals (${count})` : 'VaultOS Terminals'); };
    const TW = createTermWorkspace(document.getElementById('term-area'), {
      store: 'vaultboard.termwin',
      persist: false,
      host: 'window',
      sideDefault: 'side',
      // A clicked vault path opens as a tab in the main VaultOS window.
      onOpenPath: (rel) => {
        if (chan) chan.postMessage({ open: rel });
        try { if (window.opener) window.opener.focus(); } catch (e) { /* best effort */ }
      },
      onChange: (n) => { count = n; retitle(); },
      // The window title is what shows in the taskbar while it's behind others.
      onAgents: (sum) => { alert = sum.blocked ? '⚠ needs you · ' : sum.done ? '✓ finished · ' : ''; retitle(); },
      agentLabel: () => agentName,
    });

    // The theme follows the main window (the storage event fires in the other
    // same-origin page); termui's MutationObserver rethemes the terminals.
    window.addEventListener('storage', (e) => {
      if (e.key === 'vaultboard.theme' && e.newValue) document.documentElement.dataset.theme = e.newValue;
    });

    // Called by the main window's Pop out while this window is already open.
    window.twAdopt = (metas) => {
      TW.adopt(metas);
    };

    // First load: the session(s) handed over in the URL. The URL is cleaned
    // straight away so a reload doesn't try to take them a second time.
    const params = new URLSearchParams(location.search);
    let initial = [];
    try { initial = JSON.parse(params.get('adopt') || '[]'); } catch (e) { initial = []; }
    history.replaceState(null, '', location.pathname);
    if (initial.length) window.twAdopt(initial);
    else TW.create();

    // Hand everything back as the window goes. The broadcast reaches an open
    // VaultOS window at once; the localStorage copy covers the case where none
    // is open, and gets picked up on its next load. The shells themselves keep
    // running server-side in between.
    window.addEventListener('pagehide', () => {
      const metas = TW.metas();
      if (!metas.length) return;
      try {
        const prev = JSON.parse(localStorage.getItem('vaultboard.term.returning') || '[]');
        localStorage.setItem('vaultboard.term.returning', JSON.stringify([...prev.filter((p) => !metas.some((m) => m.id === p.id)), ...metas]));
      } catch (e) { /* private mode */ }
      if (chan) chan.postMessage({ returned: metas });
    });
  </script>
</body>
</html>
